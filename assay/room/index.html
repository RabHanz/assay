<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>assay — round</title>
<style>
/* ── tokens ──────────────────────────────────────────────────────────────
   Ground, panel and rule values are sampled off the two Linear references in
   the taste library (near-black #08090b ground, panels one step lighter, the
   panel edge at #1c1b20). Syntax hues are sampled off the same diff frame:
   keyword #bb78ab, string #d0b389, call #64a0a8, number #c1a06b — a rose/tan/
   teal set, deliberately not the indigo an unbriefed dark theme reaches for.
   The accent is warm bone. Green, red and amber are all spoken for by verdict
   and stop-reason marks, so the chosen pane is carried by temperature and
   value instead: on a page where nothing else is warm or lit, the one pane
   about to be written into the repository is the one pane that looks printed. */
:root{
  --ground:#08090b; --panel:#0d0e10; --well:#0a0b0d; --lift:#121315;
  --rule:#1a1b1e; --rule2:#232427;
  --ink:#d8d7dc; --ink2:#9b9ca1; --ink3:#6f7076; --ink4:#54555a;
  --pass:#4f9d6a; --fail:#cc5c50; --absent:#8a8b91; --warn:#c0913f;
  --accent:#e9e2d1; --accent-dim:#8e8878;
  --add:rgba(79,157,106,.085); --del:rgba(204,92,80,.085);
  --add-edge:#2f6b46; --del-edge:#8c3d36;
  --kw:#b578a6; --str:#c8ab84; --num:#c1a06b; --call:#6ba0a6; --com:#5f6065; --code:#a7a8ad;
  /* JetBrains Mono first, on purpose: this is a developer tool, the face is free
     and widely installed, and it is the closest offline match to the Berkeley Mono
     the reference uses — same engineered low-contrast grotesk-mono, tall x-height,
     built to be read at 11px. Everything machine-produced is set in it. Prose falls
     to the platform's own UI grotesk (SF Pro, Segoe UI Variable, Roboto), which is
     already tuned for small dark-mode text and is not Inter. */
  --mono:"JetBrains Mono","JetBrainsMono Nerd Font",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue","Liberation Sans",Arial,sans-serif;
}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font:400 12px/1.45 var(--mono);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100dvh}
p,dl,dd,ul{margin:0}
.k{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink4)}
.dim{color:var(--ink3)}

/* ── identity bar ───────────────────────────────────────────────────────── */
.topbar{display:flex;align-items:center;gap:14px;padding:0 14px;height:38px;
  border-bottom:1px solid var(--rule);flex:none}
.mark{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink)}
.rid{font-size:11px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow{flex:1 1 auto}
.flags{display:flex;align-items:center;gap:14px;flex:none}
.flag{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.flag.on{color:var(--accent)}
/* a commit hash is hex and case-carrying: it never goes through text-transform */
.flag .lit{text-transform:none;letter-spacing:0;font-size:11px}

/* marks: a verdict is a shape, a stop reason is a bar. Two families that
   cannot be misread for one another, each also carrying its own word. */
.m{flex:none;display:inline-block;width:8px;height:8px;background:currentColor}
.m.hollow{background:none;border:1.5px solid currentColor}
.m.turn{transform:rotate(45deg)}
.m.stop{width:2px;height:11px}
.m.dot{width:6px;height:6px;border-radius:50%}
.m.dot.live{animation:beat 1.7s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.18}}
@media(prefers-reduced-motion:reduce){.m.dot.live{animation:none}}

/* ── contract strip ─────────────────────────────────────────────────────── */
.contract{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--rule);flex:none}
.cell{padding:8px 14px;border-right:1px solid var(--rule);flex:0 1 auto;min-width:0}
.cell:last-child{border-right:0;flex:1 1 300px}
.cell .k{display:block;margin-bottom:4px}
.cell .v{font-size:11.5px;color:var(--ink)}
.cell .v em{font-style:normal;color:var(--ink3)}
.task{font-size:11px;line-height:1.5;color:var(--ink2);white-space:pre-wrap;
  max-height:3em;overflow:auto;font-family:var(--mono)}
.honest{padding:7px 14px;border-bottom:1px solid var(--rule);flex:none;
  font-family:var(--sans);font-size:11.5px;line-height:1.55;color:var(--ink3)}
.honest b{font-weight:500;color:var(--ink2)}
.conn{padding:7px 14px;border-bottom:1px solid var(--rule);flex:none;
  font-family:var(--sans);font-size:11.5px;color:var(--fail)}
.stage{padding:8px 14px;border-bottom:1px solid var(--rule);flex:none;
  font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--ink2)}
.stage b{font-weight:500;color:var(--ink)}

/* ── panes ──────────────────────────────────────────────────────────────── */
.panes{display:grid;grid-template-columns:1fr;flex:1 1 auto;min-height:0}
@media(min-width:900px){
  body{height:100dvh;overflow:hidden}
  .panes{grid-template-columns:repeat(var(--n,4),minmax(0,1fr));min-height:520px}
  .pane + .pane{border-left:1px solid var(--rule)}
}
@media(max-width:899px){.pane + .pane{border-top:1px solid var(--rule2)}}
.pane{display:flex;flex-direction:column;min-height:0;position:relative}
.rail{height:2px;flex:none;background:var(--rule2)}
.pane.picked{background:var(--panel)}
.pane.picked::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--accent);pointer-events:none}

.phead{display:flex;align-items:center;gap:10px;padding:9px 14px 8px;flex:none}
.lbl{font-size:15px;letter-spacing:.06em;color:var(--ink)}
.pane.picked .lbl{color:var(--accent)}
.phase-st{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink3);
  margin-left:auto;text-align:right}

/* Equalised from JS to the tallest pane's facts, capped, so every diff in the row
   starts on the same line. Four diffs that begin at four different heights cannot be
   read across, and reading across is the whole job. */
.facts{padding:2px 14px 11px;flex:none;overflow:auto;scrollbar-width:thin;
  scrollbar-color:#2b2c30 transparent}
@media(min-width:900px){.facts{min-height:var(--fh,0px);max-height:var(--fh,none)}}
.fact{display:flex;align-items:flex-start;gap:9px;padding:3.5px 0;font-size:11px;line-height:1.35}
.fact > .k{flex:0 0 54px;padding-top:2px}
.fact .val{display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap}
.fact .m{margin-top:1px}
.word{letter-spacing:.1em;text-transform:uppercase;font-size:10.5px}
.word.pass{color:var(--pass)} .word.fail{color:var(--fail)}
.word.absent{color:var(--absent)} .word.warn{color:var(--warn)}
.qty{color:var(--ink3);font-size:10.5px}
.why{font-family:var(--sans);font-size:11px;line-height:1.45;color:var(--ink3);
  padding:7px 0 0;max-width:42ch}
/* the check's own words, so they are set as machine output rather than as prose */
.why.said{font-family:var(--mono);font-size:10.5px;line-height:1.5;color:var(--ink4);
  max-width:none;overflow-wrap:anywhere}
.cases{list-style:none;padding:8px 0 0;border-top:1px solid var(--rule);margin-top:9px}
.cases li{padding:4px 0;font-size:10.5px;line-height:1.4}
.cases .c{color:var(--ink2);display:block;overflow-wrap:anywhere}
.cases .g{color:var(--fail);display:block;overflow-wrap:anywhere}
.cases .more{color:var(--ink4)}
.tool{font-size:10.5px;color:var(--ink4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── diff: the thing being compared, so it gets the remaining height ────── */
.dbar{display:flex;align-items:baseline;gap:9px;padding:6px 14px;flex:none;white-space:nowrap;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--lift)}
.dbar .file{font-size:10.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.dbar .k{overflow:hidden;text-overflow:ellipsis}
.dbar .bytes{margin-left:auto;font-size:10px;color:var(--ink4);white-space:nowrap}
.diff{flex:1 1 auto;min-height:180px;overflow:auto;background:var(--well);padding:5px 0;
  scrollbar-width:thin;scrollbar-color:#2b2c30 transparent}
.diff::-webkit-scrollbar{width:9px;height:9px}
.diff::-webkit-scrollbar-thumb{background:#2b2c30}
.diff::-webkit-scrollbar-track{background:transparent}
@media(max-width:899px){.diff{max-height:340px;flex:none}}
/* ligatures off: this is code under judgement, so -> must not render as → and != must
   not render as ≠. A face that prettifies the operators is lying about the artefact. */
.ln{display:block;font-size:11px;line-height:1.55;white-space:pre;font-variant-ligatures:none;
  padding:0 12px 0 0;min-width:100%;width:max-content;color:var(--code);
  border-left:2px solid transparent}
.ln .sg{display:inline-block;width:2.2ch;padding-left:.6ch;color:var(--ink4)}
.ln.add{background:var(--add);border-left-color:var(--add-edge)}
.ln.add .sg{color:var(--pass)}
.ln.del{background:var(--del);border-left-color:var(--del-edge)}
.ln.del .sg{color:var(--fail)}
.ln.hunk{background:var(--lift);color:var(--ink4)}
.ln.meta{color:var(--ink4)}
i{font-style:normal}
.c-kw{color:var(--kw)} .c-str{color:var(--str)} .c-num{color:var(--num)}
.c-call{color:var(--call)} .c-com{color:var(--com)}
.dnone{flex:1 1 auto;min-height:180px;background:var(--well);padding:14px;
  font-family:var(--sans);font-size:11.5px;line-height:1.5;color:var(--ink3)}
@media(max-width:899px){.dnone{min-height:0;flex:none}}

/* ── receipt ────────────────────────────────────────────────────────────── */
/* Floored to the tallest receipt so the diffs also END on the same line. A floor and
   not a ceiling: the applied pane carries a Landed block the others do not have, and
   it is allowed to take the extra height rather than hide the commit behind a scroll. */
.fslot{flex:none}
@media(min-width:900px){.fslot{min-height:var(--rh,0px)}}
.rec{flex:none;padding:9px 14px;border-top:1px solid var(--rule)}
.rec .row{display:flex;gap:9px;padding:2px 0;font-size:10.5px;line-height:1.4}
.rec dt{flex:0 0 54px;color:var(--ink4);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding-top:2px}
.rec dd{color:var(--ink2);overflow-wrap:anywhere}
/* a long absolute path is clamped rather than allowed to push the read-back diff
   off the pane; the whole value stays in the title attribute */
.rec dd.path{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec dd b{font-weight:400;color:var(--ink)}
/* one line, not a repeated English sentence: the blind policy is stated once in
   the honesty strip, so each pane only needs to name the fields it is withholding */
.sealed{flex:none;padding:9px 14px;border-top:1px solid var(--rule);
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink4);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sealed .m{margin-right:8px;vertical-align:-1px}

/* ── actions ────────────────────────────────────────────────────────────── */
.act{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 14px;border-top:1px solid var(--rule);margin-top:auto}
button{font:400 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink2);background:transparent;border:1px solid var(--rule2);
  padding:8px 12px;cursor:pointer;transition:background .09s linear,color .09s linear,border-color .09s linear}
button:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
/* the accent stays reserved for the pane that has been chosen. While the round is
   still open every Choose button is a hairline, and lights only under the cursor. */
button:hover:enabled{background:var(--accent);color:var(--ground);border-color:var(--accent)}
button.go{color:var(--ground);background:var(--accent);border-color:var(--accent)}
button.go:hover:enabled{background:#fff;border-color:#fff;color:var(--ground)}
button:disabled{cursor:not-allowed;color:var(--ink4);border-color:var(--rule);background:transparent}
.hint{font-family:var(--sans);font-size:11px;line-height:1.4;color:var(--ink4);flex:1 1 120px}
.hint.err{color:var(--fail)}
.foot{flex:none;padding:8px 14px;border-top:1px solid var(--rule);
  font-size:10px;color:var(--ink4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="topbar">
  <span class="mark">assay</span>
  <span class="rid" id="rid">—</span>
  <span class="grow"></span>
  <span class="flags" id="flags" aria-live="polite"></span>
</div>
<div class="contract">
  <div class="cell"><span class="k">Pack</span><span class="v" id="pack">—</span></div>
  <div class="cell"><span class="k">File under test</span><span class="v" id="entry">—</span></div>
  <div class="cell"><span class="k">Ceilings</span><span class="v" id="ceilings">—</span></div>
  <div class="cell"><span class="k">Task given to every pane</span><p class="task" id="task">—</p></div>
</div>
<p class="honest" id="honest"></p>
<p class="conn" id="conn" hidden></p>
<p class="stage" id="stage" hidden></p>
<main class="panes" id="panes"></main>
<p class="foot" id="foot"></p>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = (v) => (v === null || v === undefined || v === "") ? "—" : Number(v).toLocaleString("en-US");
const errors = Object.create(null);
let lastRaw = "", pending = null;

/* verdict: shape carries good/bad, fill carries produced/absent, word carries the rest */
const VERDICT = {
  pass:        {word: "pass",        tone: "pass",   shape: ""},
  fail:        {word: "fail",        tone: "fail",   shape: "turn"},
  no_artifact: {word: "no artifact", tone: "absent", shape: "hollow"},
  check_error: {word: "check error", tone: "warn",   shape: "hollow turn"}
};
const STOPPED = {
  done:                  ["called done", 0],
  max_turns:             ["turn ceiling", 1],
  max_completion_tokens: ["token ceiling", 1],
  wall_seconds:          ["time ceiling", 1],
  empty_output:          ["returned nothing", 1],
  no_tool_call:          ["no tool call", 1],
  transport_error:       ["transport error", 1]
};
const WHY = {
  max_turns:             "Stopped at a ceiling, not at a wrong answer. Read this apart from the verdict.",
  max_completion_tokens: "Stopped at a ceiling, not at a wrong answer. Read this apart from the verdict.",
  wall_seconds:          "Stopped at a ceiling, not at a wrong answer. Read this apart from the verdict.",
  transport_error:       "The request failed in transport. That is our side or the provider's, not the model's answer.",
  no_tool_call:          "It answered in prose instead of calling a tool, and was stopped after one nudge.",
  empty_output:          "It spent its budget and returned nothing visible. The tokens were billed."
};
const RUNSTATE = {queued: "not started", running: "running", judging: "running the hidden check", done: "done"};

/* ── polling ─────────────────────────────────────────────────────────────── */
async function poll() {
  try {
    const r = await fetch("state.json", {cache: "no-store"});
    if (!r.ok) throw new Error("state.json returned HTTP " + r.status);
    const s = await r.json();
    conn(null);
    const raw = JSON.stringify(s);
    if (raw !== lastRaw) { lastRaw = raw; render(s); }
  } catch (e) {
    conn((e && e.message) || String(e));
  }
}
function conn(msg) {
  const el = $("conn");
  el.hidden = !msg;
  if (msg) el.textContent = "Cannot read the round state: " + msg + ". Retrying every second. What is below is the last state that was read.";
}
async function post(path, label, btn) {
  if (pending) return;
  pending = label;
  delete errors[label];
  const was = btn.textContent;
  btn.disabled = true; btn.textContent = "working";
  try {
    const r = await fetch(path, {method: "POST", headers: {"content-type": "application/json"},
                                 body: JSON.stringify({label: label})});
    const body = await r.text();
    if (!r.ok) throw new Error(body.slice(0, 240) || ("HTTP " + r.status));
    lastRaw = "";
  } catch (e) {
    errors[label] = (e && e.message) || String(e);
    btn.disabled = false; btn.textContent = was;
  } finally {
    pending = null;
    await poll();
  }
}

/* ── render ──────────────────────────────────────────────────────────────── */
function render(s) {
  const pack = s.pack || {}, pol = s.policy || {}, phase = s.phase || "unknown";
  const revealed = s.revealed === true;
  const chosen = (s.choice && s.choice.label) || null;
  const pv = (pack.name || "—") + " v" + (pack.version || "—");

  $("rid").textContent = s.round_id || "—";
  $("pack").textContent = pv;
  $("entry").textContent = pack.entrypoint || "—";
  $("task").textContent = pack.brief_excerpt || "The pack's brief was not recorded in this state.";

  let ceil = num(pol.max_turns) + " turns · " + num(pol.max_completion_tokens) +
             " completion tok · " + num(pol.wall_seconds) + " s";
  if (pol.allow_exec !== undefined) ceil += " · exec " + (pol.allow_exec ? "on" : "off");
  $("ceilings").innerHTML = esc(ceil) + ' <em>· identical for every pane</em>';

  $("honest").innerHTML =
    "<b>PASS</b> means this attempt passed the checks in pack " + esc(pv) +
    ". It says nothing about the rest of the file.<br>" +
    "Blind mode hides identity, cost and latency until you choose. Normalisation strips model names from the diffs; diff style and length can still leak.";

  const flags = [flagHTML("", phase)];
  if (s.blind !== false) flags.push(flagHTML(revealed ? "hollow" : "", revealed ? "blind · revealed" : "blind"));
  else flags.push(flagHTML("hollow", "not blind", "warn"));
  if (s.choice) flags.push(flagHTML("stop", "chose", "on", s.choice.label));
  if (s.apply && s.apply.commit) flags.push(flagHTML("stop", "applied", "on", s.apply.commit));
  $("flags").innerHTML = flags.join("");

  let stage = "";
  if (phase === "judged" && !s.choice)
    stage = "Every pane is judged. Choosing one reveals every receipt, not only the one you pick, and cannot be undone.";
  else if (phase === "chosen" && s.choice)
    stage = "You chose <b>" + esc(s.choice.label) + "</b> blind. Applying writes that pane's " +
            esc(pack.entrypoint || "file") + " into the working tree and commits it. The other workspaces stay where they are.";
  else if (phase === "applied" && s.apply)
    stage = "<b>" + esc(s.apply.label || "—") + "</b> landed as commit <b>" + esc(s.apply.commit || "—") +
            "</b>. The diff on that pane was read back from the working tree after the commit, not copied from the run.";
  $("stage").innerHTML = stage;
  $("stage").hidden = !stage;

  const cs = s.contestants || {};
  const order = (Array.isArray(s.order) ? s.order : []).filter((l) => cs[l]);
  Object.keys(cs).sort().forEach((l) => { if (order.indexOf(l) < 0) order.push(l); });

  const keep = {};
  document.querySelectorAll(".diff[data-label]").forEach((d) => { keep[d.dataset.label + d.dataset.kind] = d.scrollTop; });
  $("panes").style.setProperty("--n", String(Math.max(order.length, 1)));
  $("panes").innerHTML = order.map((l) => pane(l, cs[l] || {}, s, phase, revealed, chosen, pack)).join("") ||
    '<p class="stage">No contestants in this round.</p>';
  document.querySelectorAll(".diff[data-label]").forEach((d) => {
    const v = keep[d.dataset.label + d.dataset.kind]; if (v) d.scrollTop = v;
  });
  document.querySelectorAll("button[data-act]").forEach((b) => {
    b.addEventListener("click", () => post("/" + b.dataset.act, b.dataset.label, b));
  });
  equalise();

  const t = [];
  if (s.started_at) t.push("started " + s.started_at);
  if (s.finished_at) t.push("all panes judged " + s.finished_at);
  if (s.choice && s.choice.at) t.push("choice recorded " + s.choice.at);
  if (s.apply && s.apply.at) t.push("applied " + s.apply.at);
  $("foot").textContent = t.join("   ·   ");
}

/* One height for every facts block, so the four diffs begin on the same line and the
   eye can run across them. Capped at 260 px: a pane with a long failing-case list
   scrolls its own facts rather than pushing the diffs off the bottom of the row. */
function equalise() {
  const box = $("panes");
  box.style.removeProperty("--fh");
  box.style.removeProperty("--rh");
  if (window.innerWidth < 900) return;
  const tall = (sel, cap, v) => {
    const el = [...document.querySelectorAll(sel)];
    if (el.length) box.style.setProperty(v, Math.min(cap, Math.max(...el.map((x) => x.scrollHeight))) + "px");
  };
  /* caps are a share of the row, not fixed pixels: on a short window the diff keeps
     its majority, and on a tall one nothing gets silently cut off below the fold */
  const row = box.getBoundingClientRect().height || 600;
  const cap = (f, lo, hi) => Math.max(lo, Math.min(hi, Math.round(row * f)));
  tall(".facts", cap(0.36, 120, 300), "--fh");
  tall(".fslot > :first-child", cap(0.30, 110, 240), "--rh");
}
addEventListener("resize", equalise);

function flagHTML(shape, word, tone, lit) {
  return '<span class="flag' + (tone === "on" ? " on" : "") + '">' +
    '<i class="m ' + shape + '" style="color:' + (tone === "warn" ? "var(--warn)" : tone === "on" ? "var(--accent)" : "var(--ink4)") + '"></i>' +
    esc(word) + (lit ? ' <span class="lit">' + esc(lit) + "</span>" : "") + "</span>";
}
function fact(key, body) { return '<div class="fact"><span class="k">' + key + '</span><span class="val">' + body + "</span></div>"; }
function mark(shape, tone) { return '<i class="m ' + shape + '" style="color:var(--' + tone + ')"></i>'; }

function pane(label, c, s, phase, revealed, chosen, pack) {
  const picked = chosen === label;
  const status = c.status || "queued";
  const v = c.verdict ? VERDICT[c.verdict] : null;

  /* the rail is the at-a-glance read across all panes; it carries the verdict only */
  const railColour = v ? "var(--" + v.tone + ")" : "var(--rule2)";

  let head = RUNSTATE[status] || status;
  if (status === "running" && c.turn) head = "turn " + num(c.turn) + " of " + num((s.policy || {}).max_turns);
  const dot = status === "running" ? mark("dot live", "warn")
            : status === "done" ? "" : mark("dot", "ink4");

  /* three facts, three rows: what the check said, how it ended, whether anything came back */
  const rows = [];
  if (v) {
    let q = "";
    if (c.verdict === "fail" && typeof c.failures_count === "number" && c.failures_count > 0)
      q = '<span class="qty">' + c.failures_count + " failing case" + (c.failures_count === 1 ? "" : "s") + "</span>";
    rows.push(fact("verdict", mark(v.shape, v.tone) + '<span class="word ' + v.tone + '">' + v.word + "</span>" + q));
  } else if (status === "done") {
    rows.push(fact("verdict", mark("hollow", "ink4") + '<span class="word dim">no verdict recorded</span>'));
  }
  if (c.stopped_because) {
    const st = STOPPED[c.stopped_because] || [String(c.stopped_because).replace(/_/g, " "), 1];
    rows.push(fact("stopped", mark("stop", st[1] ? "warn" : "ink3") +
      '<span class="word ' + (st[1] ? "warn" : "dim") + '">' + esc(st[0]) + "</span>"));
  }
  if (c.empty_output === true)
    rows.push(fact("output", mark("stop", "warn") + '<span class="word warn">empty</span><span class="qty">billed, nothing returned</span>'));

  let why = WHY[c.stopped_because] ? '<p class="why">' + WHY[c.stopped_because] + "</p>" : "";
  if (c.check_detail && (c.verdict === "check_error" || c.verdict === "no_artifact"))
    why += '<p class="why said">check says: ' + esc(c.check_detail) + "</p>";

  const list = Array.isArray(c.failures) ? c.failures : [];
  let cases = "";
  if (list.length) {
    cases = '<ul class="cases">' + list.map((f) => Array.isArray(f)
      ? '<li><span class="c">' + esc(f[0]) + '</span><span class="g">' + esc(f.slice(1).join(" · ")) + "</span></li>"
      : '<li><span class="c">' + esc(f) + "</span></li>").join("");
    const more = (typeof c.failures_count === "number") ? c.failures_count - list.length : 0;
    if (more > 0) cases += '<li class="more">' + more + " further failing case" + (more === 1 ? "" : "s") + " not shown</li>";
    cases += "</ul>";
  }
  const tool = (status !== "done" && c.last_tool) ? '<p class="tool">last tool · ' + esc(c.last_tool) + "</p>" : "";
  const facts = '<div class="facts">' + rows.join("") + why + cases + tool + "</div>";

  /* The diff is the largest thing on the page, because it is what is compared.
     Once this pane has been applied the read-back takes the slot: the artefact diff's
     base is the fixture, which is no longer what is in the repository, and showing a
     stale base beside a fresh commit is the one thing this screen must not do. */
  const entry = pack.entrypoint || "the entrypoint";
  const landedHere = picked && s.apply && s.apply.commit;
  let bar, body;
  if (landedHere && s.apply.diff_readback) {
    bar = '<span class="file">' + esc(entry) + '</span><span class="k">read back from HEAD</span>' +
      '<span class="bytes">' + esc(s.apply.commit) + "</span>";
    body = diffHTML(s.apply.diff_readback, label, "back");
  } else {
    /* the byte count is only meaningful when something changed: printing the fixture's
       own size beside an empty diff reads as "530 bytes of work", which is a lie */
    bar = '<span class="file">' + esc(entry) + '</span><span class="k">fixture → workspace</span>' +
      '<span class="bytes">' + (c.artifact_diff && c.artifact_bytes ? num(c.artifact_bytes) + " b"
        : c.status === "done" ? "no change" : "") + "</span>";
    if (c.artifact_diff) body = diffHTML(c.artifact_diff, label, "art");
    else if (status !== "done") body = '<p class="dnone">The diff appears when this pane finishes and its check has run.</p>';
    else if (c.verdict === "no_artifact") body = '<p class="dnone">No file was written. There is nothing to compare.</p>';
    else if (landedHere) body = '<p class="dnone">The server recorded no read-back diff for this apply.</p>';
    else body = '<p class="dnone">The file was written and is byte-identical to the fixture.</p>';
  }
  const diff = '<div class="dbar">' + bar + "</div>" + body;

  /* identity, cost, latency: one structural gate, and nothing below it renders before the choice */
  let rec;
  if (revealed && c.reveal) {
    const r = c.reveal;
    const cost = (typeof r.cost_usd === "number")
      ? "<b>$" + r.cost_usd.toFixed(5) + "</b>" + (r.cost_source ? " · " + esc(r.cost_source) : "")
      : esc(r.cost_source || "not reported");
    /* one short row each, so four receipts stay a comparable ledger rather than four
       wrapping paragraphs, and "wrote 8,000 completion" lines up with "token ceiling" */
    rec = '<div class="rec"><span class="k">Receipt</span><dl>' +
      row("model", "<b>" + esc(r.model || "—") + "</b>") +
      row("via", esc(r.provider || "—") + " · " +
                 num(r.turns !== undefined && r.turns !== null ? r.turns : c.turn) + " turns") +
      row("wrote", "<b>" + num(r.completion_tokens) + "</b> completion · " +
                   num(r.reasoning_tokens) + " reasoning") +
      row("read", num(r.prompt_tokens) + " prompt") +
      row("cost", cost) +
      row("latency", (typeof r.latency_s === "number" ? "<b>" + r.latency_s.toFixed(1) + "</b> s" : "—")) +
      "</dl></div>";
  } else if (revealed) {
    rec = '<div class="sealed"><i class="m hollow" style="color:var(--ink4)"></i>no receipt recorded</div>';
  } else {
    rec = '<div class="sealed"><i class="m hollow" style="color:var(--ink4)"></i>sealed until you choose</div>';
  }

  /* what landed, read back from the working tree */
  let landed = "";
  if (landedHere) {
    /* the timestamp is already in the footer, so this block keeps only what the
       reader cannot get anywhere else: which commit, and which file on disk */
    landed = '<div class="rec"><span class="k">Landed</span><dl>' +
      row("commit", "<b>" + esc(s.apply.commit) + "</b>") +
      '<div class="row"><dt>path</dt><dd class="path" title="' + esc(s.apply.path || "") + '">' +
      esc(s.apply.path || "—") + "</dd></div></dl></div>";
  }

  const acts = [];
  let hint = "";
  if (!s.choice) {
    const can = phase === "judged" && !pending;
    acts.push('<button data-act="choose" data-label="' + label + '"' + (can ? "" : " disabled") + ">choose " + label + "</button>");
    if (!can) hint = phase === "running" ? "Available once every pane is judged." : "Choosing is closed in phase " + phase + ".";
  } else if (picked) {
    const done = !!landedHere;
    const can = phase === "chosen" && !done && !pending;
    acts.push('<button class="go" data-act="apply" data-label="' + label + '"' + (can ? "" : " disabled") + ">" +
      (done ? "applied" : "apply " + label + " to the tree") + "</button>");
    if (done) hint = "Applied once. The server refuses a second apply.";
    else if (!can) hint = "Applying is available in phase chosen. This round is in phase " + phase + ".";
  } else {
    hint = "Not chosen. Its workspace is kept, unapplied.";
  }
  if (errors[label]) hint = errors[label];
  const actions = '<div class="act">' + acts.join("") +
    '<span class="hint' + (errors[label] ? " err" : "") + '">' + esc(hint) + "</span></div>";

  return '<section class="pane' + (picked ? " picked" : "") + '">' +
    '<i class="rail" style="background:' + railColour + '"></i>' +
    '<div class="phead"><span class="lbl">' + esc(label) + '</span>' +
    '<span class="phase-st">' + dot + esc(head) + "</span></div>" +
    facts + diff + '<div class="fslot">' + rec + landed + "</div>" + actions + "</section>";
}

function row(k, v) { return '<div class="row"><dt>' + k + "</dt><dd>" + v + "</dd></div>"; }

/* ── diff rendering ──────────────────────────────────────────────────────── */
const KW = new Set(("def return if elif else for while in not and or None True False import from as class try except " +
  "finally raise with lambda yield pass break continue is assert global nonlocal del async await match case").split(" "));
const CALLISH = /^[A-Za-z_]\w*$/;
/* git's own framing around the payload — the read-back diff carries all of it */
const META = /^(\+\+\+|---|diff --git |index |(new|deleted) file mode |(old|new) mode |similarity index |rename |copy |Binary files )/;

/* one pass: comment, string, number, word. Everything else is escaped verbatim. */
function code(src) {
  /* highlighted one line at a time, so a docstring opener tints to end of line */
  const re = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|"""[^\n]*|'''[^\n]*)|(\b\d[\d_.]*\b)|([A-Za-z_]\w*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src)) !== null) {
    out += esc(src.slice(last, m.index));
    const t = m[0];
    let cls = m[1] ? "c-com" : m[2] ? "c-str" : m[3] ? "c-num"
            : KW.has(t) ? "c-kw"
            : (CALLISH.test(t) && src[re.lastIndex] === "(") ? "c-call" : "";
    out += cls ? '<i class="' + cls + '">' + esc(t) + "</i>" : esc(t);
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

function diffHTML(text, label, kind) {
  const lines = String(text).split("\n");
  if (lines.length && lines[lines.length - 1] === "") lines.pop();
  const html = lines.map((l) => {
    if (META.test(l)) return '<span class="ln meta">' + esc(l) + "</span>";
    if (l.startsWith("@@")) return '<span class="ln hunk">' + esc(l) + "</span>";
    const sign = l[0] === "+" ? "add" : l[0] === "-" ? "del" : "";
    const glyph = l[0] === "+" ? "+" : l[0] === "-" ? "−" : " ";
    const rest = (sign || l[0] === " ") ? l.slice(1) : l;
    return '<span class="ln ' + sign + '"><span class="sg">' + glyph + "</span>" +
      (rest === "" ? "&nbsp;" : code(rest)) + "</span>";
  }).join("");
  return '<div class="diff" data-label="' + esc(label) + '" data-kind="' + kind + '" tabindex="0">' + html + "</div>";
}

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
